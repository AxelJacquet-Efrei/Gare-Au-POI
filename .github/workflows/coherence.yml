name: Documentation coherence

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  coherence:
    name: Check project documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and assistant submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: tools/AI-assistant/pyproject.toml

      - name: Check documentation coherence
        run: uv run --project tools/AI-assistant coherence check --root .
